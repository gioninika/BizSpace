name: Deploy BizSpace

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Check out the pushed version
        uses: actions/checkout@v7

      - name: Deploy with Docker Compose
        shell: bash
        run: |
          set -euo pipefail

          ENV_FILE="$HOME/BizSpace/BizSpace.API/.env"
          if [ ! -f "$ENV_FILE" ]; then
            echo "Missing deployment environment file: $ENV_FILE"
            exit 1
          fi

          export BIZSPACE_HOST_IP="$(ip -4 route get 1.1.1.1 | awk '{for (i=1; i<=NF; i++) if ($i == "src") {print $(i+1); exit}}')"
          if [ -z "$BIZSPACE_HOST_IP" ]; then
            echo "Could not determine the VM's IPv4 address."
            exit 1
          fi

          docker compose \
            --env-file "$ENV_FILE" \
            -f "$GITHUB_WORKSPACE/deploy.yml" \
            up -d --build
