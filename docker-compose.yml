include:
  - path:
      - ./BizSpace.API/docker-compose.yml
      - ./BizSpace.API/docker-compose.override.yml
    project_directory: ./BizSpace.API

services:
  web:
    image: bizspace-web
    build:
      context: ./BizSpace
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "4000"
    depends_on:
      bizspace:
        condition: service_started
    ports:
      - "4200:4000"
    restart: unless-stopped
