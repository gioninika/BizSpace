# Compose reads secrets from ~/.bizspace.env; keep that file private.

name: bizspace

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Compose loads this password from ~/.bizspace.env.
      MSSQL_SA_PASSWORD: "${BIZSPACE_DB_SA_PASSWORD:?Create ~/.bizspace.env first}"
    volumes:
      - bizspace-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  bizspace:
    build:
      context: ./BizSpace.API
      dockerfile: BizSpace.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      Database__ApplyMigrations: "true"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=BizSpace;User Id=sa;Password=${BIZSPACE_DB_SA_PASSWORD:?Create ~/.bizspace.env first};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__Key: "${JWT_SIGNING_KEY:?Create ~/.bizspace.env first}"
      Jwt__Issuer: "BizSpace.Api"
      Jwt__Audience: "BizSpace.Client"
      Auth__CodeHmacKey: "${AUTH_CODE_HMAC_KEY:?Create ~/.bizspace.env first}"
      SeedAdmin__Email: "${SEED_ADMIN_EMAIL:?Add SEED_ADMIN_EMAIL to the env file}"
      SeedAdmin__Password: "${SEED_ADMIN_PASSWORD:?Add SEED_ADMIN_PASSWORD to the env file}"
      Email__Host: "${SMTP_HOST:-}"
      Email__Port: "${SMTP_PORT:-587}"
      Email__UserName: "${SMTP_USERNAME:-}"
      Email__Password: "${SMTP_PASSWORD:-}"
      Email__FromAddress: "${SMTP_FROM_ADDRESS:-}"
      Email__FromName: "${SMTP_FROM_NAME:-BizSpace}"
      Email__UseStartTls: "${SMTP_USE_STARTTLS:-true}"
      Email__UseAuthentication: "${SMTP_USE_AUTHENTICATION:-true}"
      Cors__AllowedOrigins__0: "http://${BIZSPACE_HOST_IP:?Find the VM IP and set BIZSPACE_HOST_IP}:4200"
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: ./BizSpace
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      BIZSPACE_HOST_IP: "${BIZSPACE_HOST_IP:?Find the VM IP and set BIZSPACE_HOST_IP}"
    command:
      - sh
      - -c
      - >-
        sed -i "s|http://localhost:8080/api|http://$${BIZSPACE_HOST_IP}:8080/api|" /app/dist/BizSpace/browser/bizspace-config.js
        && exec node dist/BizSpace/server/server.mjs
    depends_on:
      bizspace:
        condition: service_started
    ports:
      - "4200:4000"

volumes:
  bizspace-sql-data:
