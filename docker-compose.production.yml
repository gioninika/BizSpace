# GitHub Actions reads production settings from the runner's private .env file.

name: bizspace

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${BIZSPACE_DB_SA_PASSWORD:?Set BIZSPACE_DB_SA_PASSWORD in the runner .env file}"
    volumes:
      - bizspace-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  bizspace:
    build:
      context: ./BizSpace.API
      dockerfile: BizSpace.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      Database__ApplyMigrations: "true"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=BizSpace;User Id=sa;Password=${BIZSPACE_DB_SA_PASSWORD:?Set BIZSPACE_DB_SA_PASSWORD in the runner .env file};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__Key: "${JWT_SIGNING_KEY:-${Jwt__Key:?Set JWT_SIGNING_KEY or Jwt__Key in the env file}}"
      Jwt__Issuer: "${JWT_ISSUER:-${Jwt__Issuer:-BizSpace.Api}}"
      Jwt__Audience: "${JWT_AUDIENCE:-${Jwt__Audience:-BizSpace.Client}}"
      Auth__CodeHmacKey: "${AUTH_CODE_HMAC_KEY:-${Auth__CodeHmacKey:?Set AUTH_CODE_HMAC_KEY or Auth__CodeHmacKey in the env file}}"
      SeedAdmin__Email: "${SEED_ADMIN_EMAIL:-${SeedAdmin__Email:?Set SEED_ADMIN_EMAIL or SeedAdmin__Email in the env file}}"
      SeedAdmin__Password: "${SEED_ADMIN_PASSWORD:-${SeedAdmin__Password:?Set SEED_ADMIN_PASSWORD or SeedAdmin__Password in the env file}}"
      Email__Host: "${SMTP_HOST:-${Email__Host:?Set SMTP_HOST or Email__Host in the env file}}"
      Email__Port: "${SMTP_PORT:-${Email__Port:-587}}"
      Email__UserName: "${SMTP_USERNAME:-${Email__UserName:?Set SMTP_USERNAME or Email__UserName in the env file}}"
      Email__Password: "${SMTP_PASSWORD:-${Email__Password:?Set SMTP_PASSWORD or Email__Password in the env file}}"
      Email__FromAddress: "${SMTP_FROM_ADDRESS:-${Email__FromAddress:?Set SMTP_FROM_ADDRESS or Email__FromAddress in the env file}}"
      Email__FromName: "${SMTP_FROM_NAME:-${Email__FromName:-BizSpace}}"
      Email__UseStartTls: "${SMTP_USE_STARTTLS:-${Email__UseStartTls:-true}}"
      Email__UseAuthentication: "${SMTP_USE_AUTHENTICATION:-${Email__UseAuthentication:-true}}"
      Cloudinary__CloudName: "${Cloudinary__CloudName:?Set Cloudinary__CloudName in the runner .env file}"
      Cloudinary__ApiKey: "${Cloudinary__ApiKey:?Set Cloudinary__ApiKey in the runner .env file}"
      Cloudinary__ApiSecret: "${Cloudinary__ApiSecret:?Set Cloudinary__ApiSecret in the runner .env file}"
      Cors__AllowedOrigins__0: "http://${BIZSPACE_HOST_IP:?Set the BIZSPACE_HOST_IP Actions variable}:4200"
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: ./BizSpace
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      BIZSPACE_HOST_IP: "${BIZSPACE_HOST_IP:?Set the BIZSPACE_HOST_IP Actions variable}"
    command:
      - sh
      - -c
      - >-
        sed -i "s|http://localhost:8080/api|http://$${BIZSPACE_HOST_IP}:8080/api|" /app/dist/BizSpace/browser/bizspace-config.js
        && exec node dist/BizSpace/server/server.mjs
    depends_on:
      bizspace:
        condition: service_started
    ports:
      - "4200:4000"

volumes:
  bizspace-sql-data:
